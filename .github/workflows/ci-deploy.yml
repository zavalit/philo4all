name: Verify Philo4all
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: philo4all-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test:chat
      - run: pnpm run build
      - run: pnpm run deploy:dry-run
      - run: node scripts/check-internal-links.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:a11y
      - name: "Check external links (strict: broken links fail the build)"
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 2 --timeout 20
            --max-concurrency 8 --scheme https --scheme http
            'dist/client/**/*.html'
          fail: true
