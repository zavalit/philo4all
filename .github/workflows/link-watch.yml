name: Weekly link watch
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 2 --timeout 30
            --max-concurrency 4 --accept-timeouts
            --accept '100..=103,200..=299,403,429'
            --root-dir '${{ github.workspace }}/dist/client'
            --scheme https --scheme http --scheme file
            'dist/client/**/*.html'
          fail: true
